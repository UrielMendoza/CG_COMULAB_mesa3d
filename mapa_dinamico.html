<!DOCTYPE html>
<html>
<head>
    <title>Mapa Dinámico Leaflet</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([19.3772, -98.5675], 10);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Configuración de fuentes GeoJSON
        const geojsonSources = [
            { url: 'geojson/detecciones_puntos.geojson', type: 'points' },
            { url: 'geojson/detecciones_lineas.geojson', type: 'lines' },
            { url: 'geojson/detecciones_poligonos.geojson', type: 'polygons' }
        ];

        // Objeto para almacenar todas las capas
        const layers = {
            points: {},
            lines: {},
            polygons: {}
        };

        // Estilos base para cada tipo
        const styles = {
            points: (color) => ({
                radius: 8,
                fillColor: color,
                color: '#000',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            }),
            lines: (color) => ({
                color: color,
                weight: 3,
                opacity: 0.8
            }),
            polygons: (color) => ({
                fillColor: color,
                fillOpacity: 0.4,
                color: color,
                weight: 2,
                opacity: 0.8
            })
        };

        async function loadGeoJSON() {
            try {
                // Cargar todos los GeoJSONs en paralelo
                const responses = await Promise.all(
                    geojsonSources.map(source => 
                        fetch(source.url)
                            .then(res => res.ok ? res.json() : Promise.reject())
                            .catch(() => ({ features: [] })) // Manejar errores manteniendo la estructura
                    )
                );

                responses.forEach((data, index) => {
                    const sourceType = geojsonSources[index].type;
                    const newKeys = {};

                    data.features.forEach(feature => {
                        const coords = feature.geometry.coordinates;
                        const key = JSON.stringify(coords);
                        newKeys[key] = true;
                        
                        const props = {
                            color: feature.properties.color || 'blue',
                            type: feature.properties.type || sourceType.slice(0, -1)
                        };

                        // Crear o actualizar capa
                        if (!layers[sourceType][key]) {
                            const layer = createLayer(sourceType, coords, props);
                            layer.addTo(map);
                            layers[sourceType][key] = { layer, props };
                        } else {
                            updateLayer(layers[sourceType][key], props);
                        }
                    });

                    // Eliminar elementos removidos
                    Object.keys(layers[sourceType]).forEach(key => {
                        if (!newKeys[key]) {
                            map.removeLayer(layers[sourceType][key].layer);
                            delete layers[sourceType][key];
                        }
                    });
                });

            } catch (error) {
                console.error('Error al cargar GeoJSONs:', error);
            } finally {
                setTimeout(loadGeoJSON, 10000);
            }
        }

        function createLayer(type, coords, props) {
            let layer;
            const popupContent = `Tipo: ${props.type}<br>Color: ${props.color}`;

            switch(type) {
                case 'points':
                    layer = L.circleMarker([coords[1], coords[0]], styles.points(props.color));
                    break;
                case 'lines':
                    const lineCoords = coords.map(c => [c[1], c[0]]);
                    layer = L.polyline(lineCoords, styles.lines(props.color));
                    break;
                case 'polygons':
                    const polyCoords = coords.map(ring => ring.map(c => [c[1], c[0]]));
                    layer = L.polygon(polyCoords, styles.polygons(props.color));
                    break;
            }

            return layer.bindPopup(popupContent);
        }

        function updateLayer(existingLayer, newProps) {
            const layer = existingLayer.layer;
            const oldProps = existingLayer.props;

            if (oldProps.color !== newProps.color || oldProps.type !== newProps.type) {
                layer.setStyle(styles[getLayerType(layer)](newProps.color));
                layer.setPopupContent(`Tipo: ${newProps.type}<br>Color: ${newProps.color}`);
                existingLayer.props = newProps;
            }
        }

        function getLayerType(layer) {
            if (layer instanceof L.CircleMarker) return 'points';
            if (layer instanceof L.Polyline) return 'lines';
            if (layer instanceof L.Polygon) return 'polygons';
        }

        loadGeoJSON();
    </script>
</body>
</html>
